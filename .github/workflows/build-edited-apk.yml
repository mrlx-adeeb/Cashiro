name: Build edited APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Cashiro edits patch
        run: |
          git apply --whitespace=nowarn cashiro-edits.patch
          git status --porcelain | head -50

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashiro-edited-apk
          path: app/build/outputs/apk/standard/debug/*.apk
          retention-days: 7
